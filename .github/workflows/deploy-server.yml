name: Server CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Validate public-report files
        run: node website/build/check.mjs

      - name: Syntax-check all scripts
        run: |
          for file in website/*.js website/client/*.js website/server/*.mjs website/build/*.mjs; do node --check "$file"; done

      - name: Run server tests
        working-directory: website
        run: npm test

  deploy:
    # Enable by setting the repository variable DEPLOY_ENABLED to "true"
    # (Settings → Secrets and variables → Actions → Variables) once the VPS exists.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Check the installed systemd unit against the repo
        # This workflow syncs website/, research/ and the migrations. It never
        # syncs the unit file: that is written once when the VPS is provisioned,
        # and the deploy user's sudo rights stop at restarting the service, so
        # CI cannot install a new one even if it wanted to.
        #
        # The failure that costs an outage is a unit naming a path the repo has
        # since moved. Everything deploys green, the restart execs a file that
        # is no longer there, and the service crash-loops. So drift is caught
        # here — before the sync and before the restart, while the running
        # process is still serving happily from the code it already loaded.
        run: |
          scp deploy/sumter-field-desk.service "deploy@${{ secrets.VPS_HOST }}:/tmp/unit.expected"
          ssh "deploy@${{ secrets.VPS_HOST }}" '
            set -euo pipefail
            if ! diff -u /etc/systemd/system/sumter-field-desk.service /tmp/unit.expected; then
              {
                echo
                echo "The installed unit does not match deploy/sumter-field-desk.service (diff above)."
                echo "Deploying would restart the service into the stale unit, so this stops here"
                echo "with the site still up. On the VPS, as root:"
                echo
                echo "  install -m 644 /tmp/unit.expected /etc/systemd/system/sumter-field-desk.service"
                echo "  systemctl daemon-reload && systemctl restart sumter-field-desk"
                echo
                echo "Then re-run this workflow."
              } >&2
              exit 1
            fi
            rm -f /tmp/unit.expected'

      - name: Sync application files
        run: |
          rsync -az --delete --exclude node_modules \
            website research deploy/migrations \
            "deploy@${{ secrets.VPS_HOST }}:/opt/sumter-field-desk/"

      - name: Install server dependencies
        run: ssh "deploy@${{ secrets.VPS_HOST }}" 'cd /opt/sumter-field-desk/website && npm ci --omit=dev'

      - name: Write server environment file
        # The systemd unit loads /opt/sumter-field-desk/server.env (optional
        # EnvironmentFile), so database credentials are fully CI-managed —
        # update the GitHub secrets and redeploy to rotate. Values travel
        # over ssh stdin, never argv. PG* vars avoid URL-encoding issues.
        env:
          # Passed as environment variables, never interpolated into the script
          # text. `${{ }}` substitution happens before bash parses the line, so
          # a "|" in an Auth0 sub — or a quote, space or "$" in a password —
          # would otherwise become shell syntax on the runner.
          DB_HOST: ${{ secrets.DATABASE_HOST }}
          DB_USER: ${{ secrets.DATABASE_USER }}
          DB_PW: ${{ secrets.DATABASE_PW }}
          ADMINS: ${{ vars.BOARD_ADMINS }}
          # Petition. PETITION_SECRET keys the HMACs used for deduplication and
          # for the hashed network prefixes; rotating it orphans every existing
          # dedup key, so set it once and leave it. Without it the sign route
          # refuses to record anything rather than hashing under a known value.
          PETITION_SECRET: ${{ secrets.PETITION_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          # Optional, and empty unless someone sets it: '1' refuses signatures
          # the anti-bot check could not cover, instead of flagging them.
          TURNSTILE_REQUIRED: ${{ vars.TURNSTILE_REQUIRED }}
        run: |
          # Tolerate a value pasted with surrounding quotes, which is easy to do
          # in the GitHub variables UI and otherwise ends up inside the sub.
          ADMINS="${ADMINS%\"}"; ADMINS="${ADMINS#\"}"
          ADMINS="${ADMINS%\'}"; ADMINS="${ADMINS#\'}"
          printf '%s\n' "$DB_HOST" "$DB_USER" "$DB_PW" "$ADMINS" "$PETITION_SECRET" \
            "$TURNSTILE_SECRET" "$RESEND_API_KEY" "$MAIL_FROM" "$MAIL_REPLY_TO" "$PUBLIC_ORIGIN" "$API_ORIGIN" \
            "$TURNSTILE_REQUIRED" | \
            ssh "deploy@${{ secrets.VPS_HOST }}" '
              set -euo pipefail
              IFS= read -r HOST; IFS= read -r DB_USER; IFS= read -r DB_PW; IFS= read -r ADMINS
              IFS= read -r PETITION_SECRET; IFS= read -r TURNSTILE_SECRET; IFS= read -r RESEND_API_KEY
              IFS= read -r MAIL_FROM; IFS= read -r MAIL_REPLY_TO
              IFS= read -r PUBLIC_ORIGIN; IFS= read -r API_ORIGIN
              # Reads must stay in the order the lines were printed above.
              IFS= read -r TURNSTILE_REQUIRED
              PORT=5432
              if [[ "$HOST" == *:* ]]; then PORT="${HOST##*:}"; HOST="${HOST%%:*}"; fi
              umask 077
              # TRUST_PROXY: the service only ever answers through Caddy, so the
              # client address comes from X-Forwarded-For rather than the socket.
              printf "PGHOST=%s\nPGPORT=%s\nPGUSER=%s\nPGPASSWORD=%s\nPGDATABASE=scc4t\nPGSSLMODE=require\nBOARD_ADMINS=%s\nPETITION_SECRET=%s\nTURNSTILE_SECRET=%s\nRESEND_API_KEY=%s\nMAIL_FROM=%s\nMAIL_REPLY_TO=%s\nPUBLIC_ORIGIN=%s\nAPI_ORIGIN=%s\nTURNSTILE_REQUIRED=%s\nTRUST_PROXY=1\n" \
                "$HOST" "$PORT" "$DB_USER" "$DB_PW" "$ADMINS" "$PETITION_SECRET" "$TURNSTILE_SECRET" \
                "$RESEND_API_KEY" "$MAIL_FROM" "$MAIL_REPLY_TO" "$PUBLIC_ORIGIN" "$API_ORIGIN" \
                "$TURNSTILE_REQUIRED" > /opt/sumter-field-desk/server.env'

      - name: Run database migrations
        # Runs psql on the VPS (the only IP the database trusts) using the
        # environment file written above. Migration files are idempotent, so
        # replaying all of them each deploy is safe.
        run: |
          ssh "deploy@${{ secrets.VPS_HOST }}" '
            set -euo pipefail
            command -v psql >/dev/null || { echo "psql missing on VPS: apt-get install -y postgresql-client" >&2; exit 1; }
            # Read the file literally instead of sourcing it. Sourcing runs the
            # values through a shell, so a "|" in an Auth0 sub or a space or "$"
            # in a password becomes syntax. Only PG* is needed here, so
            # BOARD_ADMINS is never touched by this step at all.
            while IFS= read -r line; do
              case "$line" in
                PG*=*) export "${line%%=*}=${line#*=}" ;;
              esac
            done < /opt/sumter-field-desk/server.env
            for file in /opt/sumter-field-desk/migrations/*.sql; do
              echo "Applying ${file##*/}"
              psql -v ON_ERROR_STOP=1 -q -f "$file"
            done'

      - name: Restart service
        run: ssh "deploy@${{ secrets.VPS_HOST }}" 'sudo systemctl restart sumter-field-desk'

      - name: Verify deployment health
        run: |
          ssh "deploy@${{ secrets.VPS_HOST }}" '
            for attempt in 1 2 3 4 5; do
              sleep 2
              if curl -fsS http://localhost:4173/api/health; then exit 0; fi
            done
            echo "Health check failed" >&2
            systemctl status sumter-field-desk --no-pager >&2 || true
            exit 1'
