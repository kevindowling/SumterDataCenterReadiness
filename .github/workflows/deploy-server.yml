name: Server CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Validate public-report files
        run: node website/check.mjs

      - name: Syntax-check all scripts
        run: |
          for file in website/*.mjs website/*.js; do node --check "$file"; done

      - name: Run server tests
        working-directory: website
        run: npm test

  deploy:
    # Enable by setting the repository variable DEPLOY_ENABLED to "true"
    # (Settings → Secrets and variables → Actions → Variables) once the VPS exists.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync application files
        run: |
          rsync -az --delete --exclude node_modules \
            website research deploy/migrations \
            "deploy@${{ secrets.VPS_HOST }}:/opt/sumter-field-desk/"

      - name: Install server dependencies
        run: ssh "deploy@${{ secrets.VPS_HOST }}" 'cd /opt/sumter-field-desk/website && npm ci --omit=dev'

      - name: Run database migrations
        # Runs psql on the VPS (the only IP the database trusts). Migration
        # files are idempotent, so replaying all of them each deploy is safe.
        # Credentials travel over ssh stdin, never argv. Using PG* env vars
        # instead of a URL avoids password URL-encoding issues.
        run: |
          printf '%s\n' "${{ secrets.DATABASE_HOST }}" "${{ secrets.DATABASE_USER }}" "${{ secrets.DATABASE_PW }}" | \
            ssh "deploy@${{ secrets.VPS_HOST }}" '
              set -euo pipefail
              command -v psql >/dev/null || { echo "psql missing on VPS: apt-get install -y postgresql-client" >&2; exit 1; }
              IFS= read -r PGHOST; IFS= read -r PGUSER; IFS= read -r PGPASSWORD
              if [[ "$PGHOST" == *:* ]]; then PGPORT="${PGHOST##*:}"; PGHOST="${PGHOST%%:*}"; export PGPORT; fi
              export PGHOST PGUSER PGPASSWORD PGDATABASE=scc4t PGSSLMODE=require
              for file in /opt/sumter-field-desk/migrations/*.sql; do
                echo "Applying ${file##*/}"
                psql -v ON_ERROR_STOP=1 -q -f "$file"
              done'

      - name: Restart service
        run: ssh "deploy@${{ secrets.VPS_HOST }}" 'sudo systemctl restart sumter-field-desk'

      - name: Verify deployment health
        run: |
          ssh "deploy@${{ secrets.VPS_HOST }}" '
            for attempt in 1 2 3 4 5; do
              sleep 2
              if curl -fsS http://localhost:4173/api/health; then exit 0; fi
            done
            echo "Health check failed" >&2
            systemctl status sumter-field-desk --no-pager >&2 || true
            exit 1'
