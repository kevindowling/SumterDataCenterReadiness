name: Deploy research desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: prerender.mjs stamps each sitemap URL with its note's
          # last commit date, which a shallow clone flattens to one date.
          fetch-depth: 0

      - name: Validate research desk
        run: node website/check.mjs

      - name: Assemble static site
        run: |
          mkdir -p _site/research
          # Every browser script is a .js; the build and server scripts are .mjs
          # and stay behind. Globbing means a new module ships without anyone
          # having to remember this list — app.js imports petition.js, and an
          # omission here breaks the whole app, not just one feature.
          cp website/*.js website/index.html website/styles.css website/manifest.webmanifest website/favicon.svg _site/
          cp -r website/vendor _site/vendor
          cp -r website/icons _site/icons
          cp research/*.md _site/research/
          touch _site/.nojekyll
          test ! -e _site/data-center-environmental-research-report.md

      - name: Prerender routes, sitemap, and link previews
        run: node website/prerender.mjs _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
