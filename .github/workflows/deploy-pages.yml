name: Deploy research desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: prerender.mjs stamps each sitemap URL with its note's
          # last commit date, which a shallow clone flattens to one date.
          fetch-depth: 0

      - name: Validate research desk
        run: node website/build/check.mjs

      - name: Assemble static site
        run: |
          mkdir -p _site/research
          # website/ is laid out the way the site is served: client/ and assets/
          # keep their names in the URL, and index.html and sw.js sit at the
          # root, sw.js has to, or the worker cannot claim scope "/".
          # Copying whole directories means a new module ships without anyone
          # having to remember a list; app.js imports petition.js, and an
          # omission here breaks the whole app, not just one feature.
          cp website/index.html website/sw.js _site/
          cp -r website/client _site/client
          cp -r website/assets _site/assets
          cp research/*.md research/*.pdf research/*.jpg _site/research/
          touch _site/.nojekyll
          test ! -e _site/data-center-environmental-research-report.md

      - name: Prerender routes, sitemap, and link previews
        run: node website/build/prerender.mjs _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
