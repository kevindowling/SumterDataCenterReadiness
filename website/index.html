<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A community research report on the proposed Sumter County data center." />
    <meta name="theme-color" content="#171a18" />
    <title>Sumter Field Desk - Data Center Research</title>
    <link rel="canonical" href="https://scc4t.com/" />
    <!-- Link previews. prerender.mjs replaces these per note at build time so a
         shared link describes the note it points at; these are the home-page
         values and the fallback for the dev server. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sumter Field Desk" />
    <meta property="og:title" content="Sumter Field Desk - Data Center Research" />
    <meta property="og:description" content="A community research report on the proposed Sumter County data center." />
    <meta property="og:url" content="https://scc4t.com/" />
    <meta property="og:image" content="https://scc4t.com/icons/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sumter Field Desk - Data Center Research" />
    <meta name="twitter:description" content="A community research report on the proposed Sumter County data center." />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <link rel="manifest" href="./assets/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Still required by iOS before 15.4, which predates manifest `display`
         support; Chrome warns it is deprecated, hence the standard tag above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Field Desk" />
    <!-- Fonts are served from this origin (tools/vendor-fonts.py), so a page
         view makes no request to Google. That removes the last per-visit third
         party from the research notes and the calendar, and it means the two
         preconnects, the media="print" onload trick, and its <noscript> twin
         are all unnecessary: a same-origin stylesheet this small is not worth
         deferring, and the browser can start the font fetch from the markup
         rather than after a round trip to fonts.googleapis.com. -->
    <link rel="stylesheet" href="./assets/fonts.css" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./assets/fonts/newsreader-latin.woff2" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div id="app"><noscript>This research desk requires JavaScript.</noscript></div>
    <script type="module" src="./client/app.js"></script>
  </body>
</html>
